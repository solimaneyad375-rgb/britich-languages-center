<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C778" />
      <stop offset="50%" stop-color="#C5A04B" />
      <stop offset="100%" stop-color="#9A7B2C" />
    </linearGradient>
    <!-- Deep Navy Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183D75" />
      <stop offset="100%" stop-color="#102F5C" />
    </linearGradient>
    <!-- Red Accent Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E61E3E" />
      <stop offset="100%" stop-color="#C8102E" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#102F5C" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- SHIELD EMBLEM -->
  <g transform="translate(40, 15)" filter="url(#subtleGlow)">
    <!-- Outer Shield Border Gold -->
    <path d="M 85 5 
             C 125 5, 155 12, 160 55 
             C 160 115, 115 155, 85 170 
             C 55 155, 10 115, 10 55 
             C 15 12, 45 5, 85 5 Z" 
          fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Inner Shield Inset -->
    <path d="M 85 14 
             C 118 14, 145 20, 149 56 
             C 149 108, 110 144, 85 158 
             C 60 144, 21 108, 21 56 
             C 25 20, 52 14, 85 14 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- British Crossed Bars (Stylized Academic Union Jack motif) -->
    <!-- Soft diagonal rays in faint gold/blue -->
    <path d="M 30 30 L 140 140 M 140 30 L 30 140" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.12" />
    
    <!-- Red Cross Vertical & Horizontal with gold trim -->
    <path d="M 85 20 L 85 150 M 25 68 L 145 68" stroke="url(#redGrad)" stroke-width="4" stroke-opacity="0.85" />
    <path d="M 85 20 L 85 150 M 25 68 L 145 68" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.9" />

    <!-- Royal Crown at Top of Shield -->
    <g transform="translate(85, 42) scale(0.75)">
      <!-- Crown Base -->
      <path d="M -28 0 L 28 0 L 22 10 L -22 10 Z" fill="url(#goldGrad)" />
      <!-- Crown Peaks -->
      <path d="M -26 0 L -30 -16 L -16 -6 L 0 -22 L 16 -6 L 30 -16 L 26 0 Z" fill="url(#goldGrad)" />
      <!-- Crown Jewels -->
      <circle cx="-30" cy="-16" r="2.5" fill="#FFFFFF" />
      <circle cx="0" cy="-22" r="3" fill="#FFFFFF" />
      <circle cx="30" cy="-16" r="2.5" fill="#FFFFFF" />
      <circle cx="-14" cy="5" r="2" fill="url(#redGrad)" />
      <circle cx="0" cy="5" r="2.5" fill="#102F5C" />
      <circle cx="14" cy="5" r="2" fill="url(#redGrad)" />
    </g>

    <!-- Open Book of Knowledge in Center -->
    <g transform="translate(85, 96) scale(0.95)">
      <!-- Left Page -->
      <path d="M 0 10 C -12 2, -26 2, -36 5 L -36 -18 C -26 -21, -12 -21, 0 -13 Z" 
            fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="1.8" />
      <!-- Right Page -->
      <path d="M 0 10 C 12 2, 26 2, 36 5 L 36 -18 C 26 -21, 12 -21, 0 -13 Z" 
            fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="1.8" />
      <!-- Book Spine -->
      <line x1="0" y1="-13" x2="0" y2="12" stroke="url(#goldGrad)" stroke-width="2.5" />
      <!-- Academic Quill / Torch Center Symbol -->
      <circle cx="0" cy="-18" r="3" fill="url(#goldGrad)" />
      <path d="M -2 -15 L 2 -15 L 0 -6 Z" fill="url(#goldGrad)" />
      
      <!-- Script Lines on Left Page -->
      <line x1="-30" y1="-10" x2="-8" y2="-8" stroke="#102F5C" stroke-width="1.2" stroke-opacity="0.4" />
      <line x1="-30" y1="-3" x2="-8" y2="-1" stroke="#102F5C" stroke-width="1.2" stroke-opacity="0.4" />
      <line x1="-30" y1="4" x2="-12" y2="5" stroke="#102F5C" stroke-width="1.2" stroke-opacity="0.4" />
      
      <!-- Script Lines on Right Page -->
      <line x1="8" y1="-8" x2="30" y2="-10" stroke="#102F5C" stroke-width="1.2" stroke-opacity="0.4" />
      <line x1="8" y1="-1" x2="30" y2="-3" stroke="#102F5C" stroke-width="1.2" stroke-opacity="0.4" />
      <line x1="12" y1="5" x2="30" y2="4" stroke="#102F5C" stroke-width="1.2" stroke-opacity="0.4" />
    </g>

    <!-- Academic Laurel Wreath at Shield Bottom -->
    <g transform="translate(85, 134) scale(0.85)">
      <!-- Left Laurel -->
      <path d="M -8 15 C -20 10, -28 -2, -26 -16" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
      <circle cx="-16" cy="11" r="2.2" fill="url(#goldGrad)" />
      <circle cx="-24" cy="4" r="2.2" fill="url(#goldGrad)" />
      <circle cx="-27" cy="-5" r="2.2" fill="url(#goldGrad)" />
      <circle cx="-25" cy="-14" r="2.2" fill="url(#goldGrad)" />
      <!-- Right Laurel -->
      <path d="M 8 15 C 20 10, 28 -2, 28 -16" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
      <circle cx="16" cy="11" r="2.2" fill="url(#goldGrad)" />
      <circle cx="24" cy="4" r="2.2" fill="url(#goldGrad)" />
      <circle cx="27" cy="-5" r="2.2" fill="url(#goldGrad)" />
      <circle cx="25" cy="-14" r="2.2" fill="url(#goldGrad)" />
      <!-- Center Star -->
      <polygon points="0,8 2.5,14 8,14 4,18 5.5,24 0,20 -5.5,24 -4,18 -8,14 -2.5,14" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- TEXT BRANDING (ENGLISH & ARABIC) -->
  <g transform="translate(225, 48)">
    <!-- English Main Title: BRITISH CENTER -->
    <text x="0" y="24" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="34" font-weight="800" fill="#102F5C" letter-spacing="1.5">
      BRITISH CENTER
    </text>

    <!-- Subtitle: FOR LANGUAGES & PROFESSIONAL TRAINING -->
    <text x="2" y="52" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#C5A04B" letter-spacing="4">
      FOR LANGUAGES
    </text>

    <!-- Gold Accent Divider Bar -->
    <g transform="translate(0, 64)">
      <line x1="2" y1="0" x2="345" y2="0" stroke="url(#goldGrad)" stroke-width="1.8" />
      <circle cx="170" cy="0" r="3.5" fill="#C8102E" stroke="url(#goldGrad)" stroke-width="1.2" />
    </g>

    <!-- Arabic Title: المركز البريطاني لتعليم اللغات -->
    <text x="345" y="94" font-family="'Cairo', 'IBM Plex Sans Arabic', Tahoma, sans-serif" font-size="22" font-weight="700" fill="#102F5C" text-anchor="end" direction="rtl">
      المركز البريطاني لتعليم اللغات
    </text>

    <!-- Accreditation & Institutional Footer Tag -->
    <g transform="translate(2, 116)">
      <rect x="0" y="-13" width="345" height="18" rx="3" fill="#EAF1F8" />
      <text x="172" y="0" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#102F5C" text-anchor="middle" letter-spacing="1.2">
        UK COOPERATION • COMPANIES HOUSE: 16605467 • UKRLP: 10099520
      </text>
    </g>
  </g>
</svg>

